stackup:
  - id: median_rent
    topic: housing
    title: Median gross rent
    dcid: Median_GrossRent_HousingUnit_WithCashRent_OccupiedHousingUnit_RenterOccupied
    unit: USD
    prefix: "$"
    direction: high
    keywords: [rent, renter, landlord, eviction, shelter, housing costs]
    question: How expensive is renting in Connecticut compared to the rest of America?
    answer: "Connecticut's median gross rent was ${value} in {date}, the {rank_word}-highest of {n} peers."
    validated: "live 2026-09-30"

    census1yr:
      vintages: [2025, 2024]
      value: B25113_001E
      table: B25113
  - id: unemployment
    topic: economy
    title: Unemployment rate
    dcid: UnemploymentRate_Person
    trend: true
    unit: percent
    suffix: "%"
    direction: high
    keywords: [unemployment, jobs report, layoffs, hiring, jobless]
    question: Is Connecticut's job market doing better or worse than the rest of the country?
    answer: "Connecticut's unemployment rate is {value} ({date}), the {rank_word}-highest of {n} peers."
    validated: "live 2026-09-30"

  - id: median_home_value
    topic: housing
    title: Median home value
    dcid: Median_HomeValue_HousingUnit_OccupiedHousingUnit_OwnerOccupied
    unit: USD
    prefix: "$"
    direction: high
    keywords: [home prices, homevalues, housing market, homebuyers, affordability]
    question: Are Connecticut homes expensive by national standards?
    answer: "The median Connecticut home is worth ${value} ({date}), the {rank_word}-highest of {n} peers."
    validated: "live 2026-09-30"

    census1yr:
      vintages: [2025, 2024]
      value: B25077_001E
      table: B25077
  - id: household_income
    topic: economy
    title: Median household income
    dcid: Median_Income_Household
    unit: USD
    prefix: "$"
    direction: high
    keywords: [wages, income, pay raise, cost of living, poverty line]
    question: What do Connecticut households earn compared with the rest of the country?
    answer: "Connecticut's median household income is ${value} ({date}), the {rank_word}-highest of {n} peers."
    validated: "live 2026-09-30"

    census1yr:
      vintages: [2025, 2024]
      value: B19013_001E
      table: B19013
  - id: poverty
    topic: equity
    title: Share below poverty line
    dcid: Count_Person_BelowPovertyLevelInThePast12Months
    denominator: Count_Person
    per: 100
    unit: percent
    suffix: "%"
    direction: low
    keywords: [poverty, safety net, SNAP, food insecurity, hardship]
    question: How many Connecticut residents live below the poverty line compared with the rest of the country?
    answer: "{value} of Connecticut residents live below the poverty line ({date}), the {low_word}-lowest of {n} peers."
    validated: "live 2026-09-30"

    census1yr:
      vintages: [2025, 2024]
      num: B17020_002E
      den: B17020_001E
      per: 100
      table: B17020
  - id: violent_crime
    topic: justice
    title: Violent crime per 100k
    dcid: Count_CriminalActivities_ViolentCrime
    denominator: Count_Person
    per: 100000
    unit: per 100k
    direction: low
    # "Safest" measured more than one reported rate can carry, and
    # reporting coverage varies by state — the plain ranking says what
    # the data says.
    superlative: null
    keywords: [crime, homicide, violent crime, public safety, shooting]
    question: How does Connecticut’s reported violent crime compare with
      the rest of the country?
    answer: "Connecticut reports {value} violent crimes per 100k people ({date}), the {low_word}-lowest reported of {n} peers. Reported rates compare reporting, not safety."
    validated: "live 2026-09-30"

local:
  - id: grand_list_growth
    topic: local-finance
    socrata_id: webp-fgt3
    question: Which Connecticut towns grew their property tax base fastest?
    keywords: [budget, mill rate, property tax, town meeting, assessment, grand list]
    answer: "{top_town} added ${added} of net taxable property in {latest_year} (+{pct}%), the fastest growth of {n} towns."
    validated: "row-verified 2026-09-30"

  - id: equalized_grand_list
    topic: local-finance
    socrata_id: 8rr8-a322
    answerer: town_metric_growth
    columns:
      socrata_id: 8rr8-a322
      year: grand_list_year
      town: town_name
      value: total_net_assessment
    question: Which Connecticut towns saw the fastest growth in equalized property assessments?
    chart_label: Equalized assessment growth
    keywords: [property tax, assessment, reassessment, revaluation]
    answer: "{top_town} led the {n} towns measured in equalized assessment growth in {latest_year} (+{pct}%), adding ${added}."
    validated: "row-verified 2026-09-30"

  - id: mill_rates
    topic: local-finance
    socrata_id: emyx-j53e
    answerer: mill_rates
    columns:
      socrata_id: emyx-j53e
      year: fiscal_year
      fiscal_year: 2027
      town: municipality
      grand_list_id: webp-fgt3
      grand_list_year: 2025
    question: Which Connecticut town has the highest property tax rate?
    chart_label: Property tax rate
    keywords: [mill rate, property tax, tax bill, budget, town council, assessment]
    answer: "In fiscal year {fiscal_year}, {top_town} taxes real property at
      {rate} mills, {multiple} times the {state}-mill rate that property pays
      statewide across {n} towns."
    validated: "row-verified 2026-10-05; weighted state figure documented in adapter"

  - id: municipal_fiscal
    # Parked: the dataset is verified, the card is not. xgef-f6jp is a
    # long-format metric/value table with mixed report editions (a "2026"
    # row belongs to the 2019-2023 edition), so growth needs edition+metric
    # filters before a year-over-year answer is honest. The proposer skips
    # entries with no question/answer templates (questions._answerable).
    topic: local-finance
    socrata_id: xgef-f6jp
    keywords: [municipal finance, town budget]
    validated: "dataset row-verified 2026-09-30; no card template yet"

# The national weather Connecticut lives in. These series have no state
# breakdown, so the cards say "US" in the answer instead of faking a
# Connecticut angle; the trend chart is the picture and the superlative is
# computed against every print, never written by hand. One jobs-report day
# may open several of these questions at once — balance_by_topic lets the
# whole set publish together, because a single honest number on a single
# honest day is exactly what the desk is for.
national:
  - id: hires_rate
    topic: economy
    title: JOLTS hiring rate
    agency: "US Bureau of Labor Statistics, Job Openings and Labor Turnover Survey"
    fred: {series: JTSHIR}
    unit: percent
    suffix: "%"
    extreme: min
    keywords: [hiring, hires, job openings, labor market, jobs report, employment report]
    question: Is America still hiring people into new jobs?
    answer: "Employers hired {value} of America's workforce into new jobs in {date} — {extreme}."
    validated: "live series probe 2026-10-05"

  - id: quits_rate
    topic: economy
    title: JOLTS quits rate
    agency: "US Bureau of Labor Statistics, Job Openings and Labor Turnover Survey"
    fred: {series: JTSQUR}
    unit: percent
    suffix: "%"
    extreme: min
    keywords: [quitting, quits, walkaway, job switching, labor market, resignation]
    question: Are workers still confident enough to quit?
    answer: "Only {value} of US workers quit their jobs in {date} — {extreme}."
    validated: "live series probe 2026-10-05"

  - id: layoffs_rate
    topic: economy
    title: JOLTS layoffs and discharges rate
    agency: "US Bureau of Labor Statistics, Job Openings and Labor Turnover Survey"
    fred: {series: JTSLDR}
    unit: percent
    suffix: "%"
    extreme: min
    keywords: [layoff, layoffs, job cuts, workforce reduction, restructuring]
    question: Are employers laying everyone off, really?
    answer: "US layoffs and discharges ran at {value} in {date} — {extreme} for this series, which began in 2000."
    validated: "live series probe 2026-10-05"

  - id: unemployment_duration
    topic: economy
    title: Median weeks unemployed
    agency: "US Bureau of Labor Statistics, Current Population Survey"
    fred: {series: UEMPMED}
    unit: weeks
    precision: 1
    suffix: ""
    extreme: max
    keywords: [unemployment, jobless, long-term unemployed, out of work]
    question: When Americans lose a job, how long are they out?
    answer: "The median unemployed US worker has been out of work {value} weeks ({date}) — {extreme}."
    validated: "live series probe 2026-10-05"

  - id: prime_age_participation
    topic: economy
    title: Prime-age labor force participation
    agency: "US Bureau of Labor Statistics, Current Population Survey"
    fred: {series: LNS11300060}
    unit: percent
    suffix: "%"
    extreme: max
    keywords: [labor force, participation rate, workforce, jobs report, labor supply]
    question: Are working-age Americans in the labor force?
    answer: "{value} of Americans aged 25 to 54 were working or looking for work in {date} — {extreme}."
    validated: "live series probe 2026-10-05"

  - id: labor_share
    topic: equity
    title: Labor share of output (index, 2017=100)
    agency: "US Bureau of Labor Statistics, Productivity and Costs"
    fred: {series: PRS85006173, freq: quarterly}
    unit: index
    precision: 1
    suffix: ""
    extreme: min
    keywords: [productivity, wage share, labor share, paychecks, workers pay, profit margins, corporate profits]
    question: Are workers keeping their share of what they produce?
    answer: "Labor's share of US nonfarm output sits at {value} on the 2017=100 index ({date}) — {extreme} since the series began in 1947."
    validated: "live series probe 2026-10-05"

  - id: jobless_claims
    topic: economy
    title: Initial jobless claims (weekly)
    agency: "US Department of Labor, Weekly Unemployment Insurance Claims"
    geo: United States
    fred: {series: ICSA, freq: weekly}
    unit: claims
    suffix: ""
    extreme: max
    keywords: [jobless claim, jobless claims, unemployment claim, pink slip,
               walking papers, restructuring, workforce reduction, downsizing]
    question: How many Americans just lost their jobs?
    answer: "{value} Americans filed first-time unemployment claims in the
      week ending {date} — {extreme} for a series that has printed every week
      since 1967."
    validated: "live series probe 2026-10-05 (raw counts, first row 1967-01-07)"

  - id: ct_unemployment
    topic: economy
    title: Connecticut unemployment rate
    agency: "US Bureau of Labor Statistics, Local Area Unemployment Statistics"
    geo: Connecticut
    fred: {series: CTUR}
    unit: percent
    suffix: "%"
    extreme: max
    keywords: [connecticut unemployment, connecticut jobless, connecticut
               labor market, connecticut jobs, connecticut economy]
    question: Is Connecticut's job market loosening?
    answer: "{value} of Connecticut's workforce was unemployed in {date} —
      {extreme} for a series that has run monthly since 1976."
    validated: "live series probe 2026-10-05 (first row 1976-01-01)"


