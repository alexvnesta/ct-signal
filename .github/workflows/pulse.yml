name: pulse

# The newsroom heartbeat: every 15 minutes, run one pipeline cycle and push.
# The commit IS the deploy (Vercel git integration) and the audit trail.
# CI is the single producer; local deploy.sh is event-day overdrive only.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: install
        run: pip install -r requirements.txt

      - name: run one cycle
        run: python run.py --once
        env:
          DC_API_KEY: ${{ secrets.DC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SOCRATA_TOKEN: ${{ secrets.SOCRATA_TOKEN }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SITE_URL: https://ctsignal.org
          CONTACT_EMAIL: hello@ctsignal.org

      - name: story OG covers
        run: python scripts/make_story_covers.py
        continue-on-error: true   # a missing cover degrades to the generic og-cover

      - name: publish + push
        if: always()   # a failed cycle re-publishes the last good site
        run: bash deploy.sh --deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Distribution: both self-skip until their secrets exist, so this
      # merges today and lights up the moment a token is added.
      - name: Bluesky card posts
        if: always()
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: bash scripts/ci_post_bsky.sh
      - name: Buttondown digest draft
        if: always()
        env:
          BUTTONDOWN_KEY: ${{ secrets.BUTTONDOWN_KEY }}
        run: bash scripts/ci_digest_draft.sh
